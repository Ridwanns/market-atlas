<section id="investment-decision" class="decision-workspace" hidden aria-labelledby="decision-title">
  <div class="decision-intro">
    <div><div class="eyebrow">Research before deploying capital</div><h2 id="decision-title" tabindex="-1">Investment Decision</h2><p id="decision-company-name" class="quiet">A business thesis, a price and a risk budget.</p></div>
    <div class="decision-controls">
      <label for="decision-ticker">Company<select id="decision-ticker" aria-label="Investment decision company"><option value="nvda">NVDA</option><option value="tsm">TSM</option><option value="intc">INTC</option><option value="amd">AMD</option><option value="mu">MU</option><option value="avgo">AVGO</option><option value="etn">ETN</option><option value="vrt">VRT</option><option value="alab">ALAB</option><option value="crdo">CRDO</option></select></label>
      <label for="decision-horizon">Holding horizon<select id="decision-horizon"><option value="5">5 years</option><option value="10">10 years</option></select></label>
      <label for="decision-explore">Explore<select id="decision-explore"><option value="overview">Decision overview</option><option value="valuation">Valuation scenarios</option><option value="fundamentals">Business fundamentals</option><option value="bottlenecks">AI bottleneck evidence</option><option value="risk">Position &amp; IDR risk</option><option value="model-health">Model health</option></select></label>
    </div>
  </div>
  <div id="decision-kpis" class="decision-kpis" aria-label="Valuation context"></div>
  <p id="decision-freshness" class="decision-freshness"></p>
  <div id="decision-content"></div>
  <details class="decision-sources panel"><summary>Sources, formulas &amp; dates</summary><div id="decision-sources-content"></div></details>
</section>
